<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de Aplicaciones</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --accent-color: #3182ce;
            --hover-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin: 0;
        }

        .grid-container {
            display: grid;
            /* Fuerza exactamente 2 columnas en pantallas de escritorio */
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            width: 100%;
            max-width: 750px; /* Ancho máximo para que las 2 columnas se vean proporcionadas */
            justify-content: center;
        }

        .app-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            border: 2px solid transparent;
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--hover-shadow);
            border-color: var(--accent-color);
        }

        .app-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .app-name {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .app-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin: 0;
        }

        footer {
            margin-top: auto;
            padding-top: 50px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-align: center;
        }

        /* Ajuste para móviles: una sola columna para que sea fácil de pulsar */
        @media (max-width: 650px) {
            .grid-container {
                grid-template-columns: 1fr;
                max-width: 400px;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Panel de Aplicaciones</h1>
        <p class="subtitle">Selecciona una herramienta para comenzar</p>
    </header>

    <div class="grid-container" id="appGrid">
        <!-- Las tarjetas se generan automáticamente con JavaScript -->
    </div>

    <footer>
        <p>Menú centralizado de herramientas</p>
    </footer>

    <script>
        // ==========================================
        // ZONA DE CONFIGURACIÓN: AÑADE TUS APPS AQUÍ
        // El orden de esta lista determina el orden visual (de arriba a abajo, izquierda a derecha).
        // ==========================================
        const aplicaciones = [
            // --- LÍNEA 1 ---
            {
                nombre: "Permisos",
                url: "https://artufer.github.io/permisos/",
                descripcion: "Solicitud y gestión de permisos.",
                icono: "✅"
            },
            {
                nombre: "Solicitud de Vacaciones",
                url: "https://artufer.github.io/solicitud-vacaciones/",
                descripcion: "Gestión y solicitud de días de vacaciones.",
                icono: "📅"
            },
            // --- LÍNEA 2 ---
            {
                nombre: "Control de Papel",
                url: "https://artufer.github.io/control-papel/",
                descripcion: "Gestión y control de inventario de papel.",
                icono: "📄"
            },
            {
                nombre: "Productos de Limpieza",
                url: "https://artufer.github.io/productos-limpieza/",
                descripcion: "Control de stock de productos de limpieza.",
                icono: "🧹"
            },
            // --- LÍNEA 3 ---
            {
                nombre: "Gestión de Alumnos",
                url: "https://adfe-leon.github.io/alumnos/",
                descripcion: "Directorio y gestión de alumnos.",
                icono: "🎓"
            },
            {
                nombre: "Gestor de Semillas",
                url: "https://adfe-leon.github.io/gestor-de-semillas/",
                descripcion: "Control e inventario de semillas.",
                icono: "🌱"
            }
            // PARA AÑADIR UNA NUEVA: 
            // 1. Añade una coma "," al final del último bloque.
            // 2. Pega el nuevo bloque { nombre, url, descripcion, icono } aquí abajo.
            // Nota: Al añadir una 7ª app, comenzará una 4ª línea con 1 elemento.
        ];

        // ==========================================
        // LÓGICA DE GENERACIÓN (NO HACE FALTA TOCAR)
        // ==========================================
        const grid = document.getElementById('appGrid');

        aplicaciones.forEach(app => {
            const card = document.createElement('a');
            card.className = 'app-card';
            card.href = app.url;
            card.target = '_blank'; // Abre en una pestaña nueva
            
            card.innerHTML = `
                <div class="app-icon">${app.icono}</div>
                <div class="app-name">${app.nombre}</div>
                <div class="app-desc">${app.descripcion}</div>
            `;
            
            grid.appendChild(card);
        });
    </script>
</body>
</html>
